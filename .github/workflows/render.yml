name: Render Bima 3D (kerja-berat)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bima3d/**'
      - 'job-kerja-berat.sh'
      - '.github/workflows/render.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bima3d/package-lock.json

      - name: Render (job-kerja-berat.sh)
        run: bash job-kerja-berat.sh

      - name: Periksa hasil render
        run: |
          test -s bima3d/out/video.mp4
          ls -la bima3d/hasil-run/
          test -n "$(ls -A bima3d/hasil-run/)"

      - name: Terbitkan potongan hasil sebagai Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "render-${{ github.run_number }}" bima3d/hasil-run/* \
            --title "Render #${{ github.run_number }}" \
            --notes "Potongan video hasil render otomatis (GitHub Actions run #${{ github.run_number }}, commit ${{ github.sha }}). Rakit kembali berurutan: cat chunk-00 chunk-01 ... > video.mp4"

      - name: Simpan hasil sebagai artifact (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: hasil-run-${{ github.run_number }}
          path: bima3d/hasil-run/
          if-no-files-found: error
